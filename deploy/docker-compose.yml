services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signalforge
      POSTGRES_USER: signalforge
      POSTGRES_PASSWORD: signalforge
    ports:
      - "5432:5432"
    volumes:
      - signalforge-postgres:/var/lib/postgresql/data

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      SIGNALFORGE_DATABASE_DRIVER: postgres
      SIGNALFORGE_DATABASE_DSN: "postgres://signalforge:signalforge@postgres:5432/signalforge?sslmode=disable"
      SIGNALFORGE_SERVER_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  signalforge-postgres:

